<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servidor de ejemplo</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; color: #203049; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(100%, 720px); padding: 40px; border: 1px solid #dde5ee; border-radius: 14px; background: white; }
    .eyebrow { color: #44668f; font-size: 12px; font-weight: 700; letter-spacing: .13em; }
    .badge { margin: 32px 0 18px; display: inline-block; padding: 6px 11px; background: #eaf6ee; color: #27623b; border-radius: 6px; font-size: 13px; }
    h1 { margin: 0 0 14px; font-size: 36px; font-weight: 600; }
    p { line-height: 1.7; color: #5d6d82; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2665ae; color: white; font: inherit; cursor: pointer; }
    #count { margin-left: 12px; font-size: 14px; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e5ebf2; color: #65758a; font-size: 13px; }
    @media (max-width: 560px) { body { padding: 20px; } main { padding: 24px; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">WEBBOX / PROTOTIPO</div>
    <div class="badge">Servidor activo</div>
    <h1>Tu web, en una ventana.</h1>
    <p>Esta página se sirve desde un proceso Node.js local, oculto y vinculado al lanzador. La ventana mantiene su título y no tiene menú ni barra de direcciones.</p>
    <button id="increment" type="button">Probar interacción</button><span id="count" aria-live="polite">0 clics</span>
    <footer>HTTP local · Windows · JavaScript · Hito 1 de 6</footer>
  </main>
  <script>
    let count = 0;
    document.getElementById('increment').addEventListener('click', () => {
      document.getElementById('count').textContent = `${++count} clics`;
    });
  </script>
</body>
</html>
